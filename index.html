<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét QR Nhà Xe - ĐH Cần Thơ</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #003d7a 0%, #00539B 50%, #00AEEF 100%);
    background-attachment: fixed;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  
  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 25px;
    width: 100%;
    max-width: 460px;
  }
  
  .logo {
  max-width: 100%;
  width: 200px;
  height: auto;
  margin: 0 auto 20px;
  display: block;
  background: #ffffff;
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.25);
}
  
  h1 {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow: 0 2px 10px rgba(0, 174, 239, 0.6);
    letter-spacing: 0.5px;
  }
  
  .sub {
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    font-weight: 400;
  }
  
  /* CONTROLS */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    justify-content: center;
    width: 100%;
    max-width: 460px;
  }
  
  button {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  
  #btnStart {
    background: #fff;
    color: #00539B;
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
  }
  
  #btnStart:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 255, 255, 0.5);
    background: #E3F2FD;
  }
  
  #btnStop {
    background: rgba(239, 68, 68, 0.95);
    color: #fff;
  }
  
  #btnStop:hover {
    transform: translateY(-2px);
    background: #dc2626;
    box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
  }
  
  /* KHUNG CAMERA - TRỐNG KHI CHƯA BẮT ĐẦU */
  #reader {
    width: 100%;
    max-width: 460px;
    min-height: 380px;
    border: 3px solid rgba(79, 195, 247, 0.6);
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3),
                inset 0 0 30px rgba(79, 195, 247, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  /* Kết quả */
  #result {
    width: 100%;
    max-width: 460px;
    margin-top: 20px;
    padding: 24px;
    border-radius: 20px;
    text-align: center;
    display: none;
    animation: popIn 0.4s ease;
  }
  
  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  
  #result.vao {
    background: linear-gradient(135deg, #059669, #10b981);
    box-shadow: 0 8px 40px rgba(16, 185, 129, 0.5);
  }
  
  #result.ra {
    background: linear-gradient(135deg, #ea580c, #f97316);
    box-shadow: 0 8px 40px rgba(249, 115, 22, 0.5);
  }
  
  #result.err {
    background: linear-gradient(135deg, #dc2626, #ef4444);
  }
  
  .hanhDong {
    font-size: 42px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 8px;
  }
  
  .hoTen {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    margin: 8px 0;
  }
  
  .maSV {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.9);
    margin-top: 6px;
  }
  
  .gio {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
    margin-top: 8px;
  }
  
  /* Footer */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    text-align: center;
    max-width: 460px;
    width: 100%;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <img src="logo.png" alt="Đại học Cần Thơ" class="logo" onerror="this.style.display='none'">
  <h1>Quét QR Nhà Xe</h1>
  <p class="sub">Đưa mã QR trên thẻ SV vào camera</p>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button id="btnStart" onclick="batDau()">▶️ Bắt đầu</button>
  <button id="btnStop" onclick="dung()">⏹️ Dừng</button>
</div>

<!-- CAMERA -->
<div id="reader"></div>
<div id="result"></div>

<!-- FOOTER -->
<div class="footer">
  Hệ thống quản lý nhà xe - Đại học Cần Thơ
</div>

<script>
// ================================================================
// URL API - GIỮ NGUYÊN, KHÔNG ĐỔI
// ================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbx1710tzj8UUJKETDPs8zkt39W3nz1TepvrOTFxgeOX9LegFwmeXRwqwbQC1VkgEwAcg/exec";
// ================================================================

let qr, dangQuet = false, khoa = false;
let trangThai = {};

function batDau() {
  if (dangQuet) return;
  qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onQuet,
    () => {}
  ).then(() => { 
    dangQuet = true;
    document.getElementById('reader').style.minHeight = 'auto';
  })
   .catch(e => alert("Không mở được camera: " + e));
}

function dung() {
  if (qr && dangQuet) {
    qr.stop().then(() => { 
      dangQuet = false; 
      qr.clear();
      document.getElementById('reader').style.minHeight = '380px';
    });
  }
}

function onQuet(text) {
  if (khoa) return;
  khoa = true;

  const maSV = text.trim();
  let hanhDong = 'VÀO';
  if (trangThai[maSV] === 'VÀO') hanhDong = 'RA';
  trangThai[maSV] = hanhDong;

  const gio = new Date().toLocaleTimeString('vi-VN');

  hienThiKetQua(maSV, hanhDong, gio);
  guiLenSheets(maSV, hanhDong);

  setTimeout(() => { khoa = false; }, 2000);
}

function hienThiKetQua(maSV, hanhDong, gio) {
  const el = document.getElementById('result');
  el.className = hanhDong === 'VÀO' ? 'vao' : 'ra';
  el.style.display = 'block';
  el.innerHTML = `
    <div class="hanhDong">${hanhDong === 'VÀO' ? '🟢 VÀO' : '🟠 RA'}</div>
    <div class="maSV">MSSV: ${maSV}</div>
    <div class="gio">🕐 ${gio}</div>
  `;
}

function guiLenSheets(maSV, hanhDong) {
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ maSV: maSV, hanhDong: hanhDong })
  }).catch(e => console.log('Gửi lỗi:', e));
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét QR Nhà Xe - ĐH Cần Thơ</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #003d7a 0%, #00539B 40%, #00AEEF 100%);
    background-attachment: fixed;
    color: #ffffff;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  /* LOGO */
  .logo-container {
    text-align: center;
    margin-bottom: 20px;
  }
  
  .logo {
    max-width: 280px;
    height: auto;
    background: #fff;
    padding: 12px 24px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  }
  
  h1 {
    color: #4FC3F7;
    text-align: center;
    margin-bottom: 8px;
    font-size: 32px;
    text-shadow: 0 0 20px rgba(79, 195, 247, 0.8),
                 0 0 40px rgba(0, 174, 239, 0.5);
    letter-spacing: 1px;
  }
  
  .sub {
    text-align: center;
    color: #E3F2FD;
    margin-bottom: 25px;
    font-size: 15px;
  }
  
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }
  
  button {
    padding: 14px 32px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
  }
  
  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 174, 239, 0.6);
  }
  
  button:active {
    transform: translateY(-1px);
  }
  
  #btnStart {
    background: linear-gradient(135deg, #00AEEF, #4FC3F7);
    color: #003d7a;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
  }
  
  #btnStop {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
  }
  
  /* KHUNG CAMERA */
  #reader {
    width: 100%;
    max-width: 500px;
    min-height: 400px;
    margin: 0 auto;
    border: 4px solid #4FC3F7;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(0, 61, 122, 0.5);
    box-shadow: 0 0 40px rgba(0, 174, 239, 0.6),
                inset 0 0 20px rgba(79, 195, 247, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  #reader:empty::before {
    content: "📷 Nhấn Bắt đầu để mở camera";
    color: #E3F2FD;
    font-size: 16px;
    text-align: center;
    padding: 20px;
  }
  
  /* Kết quả */
  #result {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    display: none;
    animation: popIn 0.4s ease;
  }
  
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  
  #result.vao {
    background: linear-gradient(135deg, #065f46, #10b981);
    border: 4px solid #34d399;
    box-shadow: 0 0 40px rgba(16, 185, 129, 0.7);
  }
  
  #result.ra {
    background: linear-gradient(135deg, #7c2d12, #ea580c);
    border: 4px solid #f59e0b;
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.7);
  }
  
  #result.err {
    background: linear-gradient(135deg, #7f1d1d, #dc2626);
    border: 4px solid #ef4444;
  }
  
  .hanhDong {
    font-size: 48px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    margin-bottom: 10px;
  }
  
  .hoTen {
    font-size: 26px;
    font-weight: bold;
    color: #fff;
    margin: 10px 0;
  }
  
  .maSV {
    font-size: 20px;
    color: #f1f5f9;
    margin-top: 8px;
    font-weight: 500;
  }
  
  .gio {
    font-size: 15px;
    color: #cbd5e1;
    margin-top: 10px;
  }
  
  /* Footer */
  .footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid rgba(79, 195, 247, 0.4);
    color: #E3F2FD;
    font-size: 13px;
    max-width: 500px;
    width: 100%;
  }
</style>
</head>
<body>

<!-- LOGO TRƯỜNG -->
<div class="logo-container">
  <img src="logo.png" alt="Đại học Cần Thơ" class="logo" onerror="this.style.display='none'">
</div>

<h1>🅿️ Quét QR Nhà Xe</h1>
<p class="sub">Đưa mã QR trên thẻ SV vào camera</p>

<div class="controls">
  <button id="btnStart" onclick="batDau()">▶️ Bắt đầu</button>
  <button id="btnStop" onclick="dung()">⏹️ Dừng</button>
</div>

<div id="reader"></div>
<div id="result"></div>

<div class="footer">
  Hệ thống quản lý nhà xe - Đại học Cần Thơ
</div>

<script>
// ================================================================
// URL API - giữ nguyên
// ================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbx1710tzj8UUJKETDPs8zkt39W3nz1TepvrOTFxgeOX9LegFwmeXRwqwbQC1VkgEwAcg/exec";
// ================================================================

let qr, dangQuet = false, khoa = false;
let trangThai = {};

function batDau() {
  if (dangQuet) return;
  qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onQuet,
    () => {}
  ).then(() => { 
    dangQuet = true;
    document.getElementById('reader').style.minHeight = 'auto';
  })
   .catch(e => alert("Không mở được camera: " + e));
}

function dung() {
  if (qr && dangQuet) {
    qr.stop().then(() => { 
      dangQuet = false; 
      qr.clear();
      document.getElementById('reader').style.minHeight = '400px';
    });
  }
}

function onQuet(text) {
  if (khoa) return;
  khoa = true;

  const maSV = text.trim();
  let hanhDong = 'VÀO';
  if (trangThai[maSV] === 'VÀO') hanhDong = 'RA';
  trangThai[maSV] = hanhDong;

  const gio = new Date().toLocaleTimeString('vi-VN');

  hienThiKetQua(maSV, hanhDong, gio);
  guiLenSheets(maSV, hanhDong);

  setTimeout(() => { khoa = false; }, 2000);
}

function hienThiKetQua(maSV, hanhDong, gio) {
  const el = document.getElementById('result');
  el.className = hanhDong === 'VÀO' ? 'vao' : 'ra';
  el.style.display = 'block';
  el.innerHTML = `
    <div class="hanhDong">${hanhDong === 'VÀO' ? '🟢 VÀO' : '🟠 RA'}</div>
    <div class="maSV">MSSV: ${maSV}</div>
    <div class="gio">🕐 ${gio}</div>
  `;
}

function guiLenSheets(maSV, hanhDong) {
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ maSV: maSV, hanhDong: hanhDong })
  }).catch(e => console.log('Gửi lỗi:', e));
}
</script>
</body>
</html>

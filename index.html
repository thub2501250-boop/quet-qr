<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét QR Nhà Xe</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    color: #38bdf8;
    text-align: center;
    margin-bottom: 10px;
    font-size: 28px;
  }
  .sub {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #btnStart {
    background: #38bdf8;
    color: #000;
  }
  #btnStop {
    background: #ef4444;
    color: #fff;
  }
  #reader {
    max-width: 500px;
    margin: 0 auto;
    border: 3px solid #38bdf8;
    border-radius: 12px;
    overflow: hidden;
  }
  #result {
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    display: none;
  }
  #result.vao {
    background: #065f46;
    border: 3px solid #10b981;
  }
  #result.ra {
    background: #7c2d12;
    border: 3px solid #f59e0b;
  }
  #result.err {
    background: #7f1d1d;
    border: 3px solid #ef4444;
  }
  .hanhDong {
    font-size: 40px;
    font-weight: bold;
  }
  .maSV {
    font-size: 20px;
    color: #cbd5e1;
    margin-top: 8px;
  }
  .gio {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 8px;
  .hoTen {
  font-size: 26px;
  font-weight: bold;
  color: #fff;
  margin: 8px 0;
}
  }
</style>
</head>
<body>

<h1>🅿️ Quét QR Nhà Xe</h1>
<p class="sub">Đưa mã QR trên thẻ SV vào camera</p>

<div class="controls">
  <button id="btnStart" onclick="batDau()">▶️ Bắt đầu</button>
  <button id="btnStop" onclick="dung()">⏹️ Dừng</button>
</div>

<div id="reader"></div>
<div id="result"></div>

<script>
// ================================================================
// THAY URL NÀY BẰNG URL WEB APP CỦA BẠN (đuôi /exec)
// ================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbx17IOtzj8UUJKETDPs8zkt39W3nzTTepvrOTFXgEOX9LegFwmeXRwqwqbQC1VkgEwAcg/exec";
// ================================================================

let qr, dangQuet = false, khoa = false;
let trangThai = {};

function batDau() {
  if (dangQuet) return;
  qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onQuet,
    () => {}
  ).then(() => { dangQuet = true; })
   .catch(e => alert("Không mở được camera: " + e));
}

function dung() {
  if (qr && dangQuet) {
    qr.stop().then(() => { dangQuet = false; qr.clear(); });
  }
}

function onQuet(text) {
  if (khoa) return;
  khoa = true;

  const maSV = text.trim();
  let hanhDong = 'VÀO';
  if (trangThai[maSV] === 'VÀO') hanhDong = 'RA';
  trangThai[maSV] = hanhDong;

  const gio = new Date().toLocaleTimeString('vi-VN');

  // Hiện kết quả tạm thời (chưa có tên)
  hienThiKetQua(maSV, hanhDong, gio, '...');

  // Gửi lên Google Sheets và nhận tên về
  guiLenSheets(maSV, hanhDong, gio);

  setTimeout(() => { khoa = false; }, 2000);
}

function hienThiKetQua(maSV, hanhDong, gio, hoTen) {
  const el = document.getElementById('result');
  el.className = hanhDong === 'VÀO' ? 'vao' : 'ra';
  el.style.display = 'block';
  el.innerHTML = `
    <div class="hanhDong">${hanhDong === 'VÀO' ? '🟢 VÀO' : '🟠 RA'}</div>
    <div class="hoTen">${hoTen}</div>
    <div class="maSV">MSSV: ${maSV}</div>
    <div class="gio">🕐 ${gio}</div>
  `;
}

function guiLenSheets(maSV, hanhDong, gio) {
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ maSV: maSV, hanhDong: hanhDong })
  }).catch(e => console.log('Gửi lỗi:', e));
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét QR Nhà Xe - ĐH Cần Thơ</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #003d7a 0%, #00539B 50%, #00AEEF 100%);
    background-attachment: fixed;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 25px;
    width: 100%;
    max-width: 460px;
  }
  .logo {
    width: 100%;
    max-width: 460px;
    height: auto;
    margin: 0 auto 25px;
    display: block;
    background: #ffffff;
    padding: 15px 25px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  }
  h1 {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow: 0 2px 10px rgba(0, 174, 239, 0.6);
  }
  .sub {
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    justify-content: center;
    width: 100%;
    max-width: 460px;
  }
  button {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #btnStart { background: #fff; color: #00539B; }
  #btnStop { background: rgba(239, 68, 68, 0.95); color: #fff; }
  
  #reader {
    width: 100%;
    max-width: 460px;
    min-height: 380px;
    border: 3px solid rgba(79, 195, 247, 0.6);
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #result {
    width: 100%;
    max-width: 460px;
    margin-top: 20px;
    padding: 24px;
    border-radius: 20px;
    text-align: center;
    display: none;
    background: linear-gradient(135deg, #059669, #10b981);
    box-shadow: 0 8px 40px rgba(16, 185, 129, 0.5);
  }
  #result.ra {
    background: linear-gradient(135deg, #ea580c, #f97316);
    box-shadow: 0 8px 40px rgba(249, 115, 22, 0.5);
  }
  .hanhDong { font-size: 42px; font-weight: bold; color: #fff; margin-bottom: 8px; }
  .maSV { font-size: 16px; color: rgba(255, 255, 255, 0.9); margin-top: 6px; }
  .viTri { 
    font-size: 22px; 
    font-weight: bold; 
    color: #FFD700;
    margin: 12px 0; 
    padding: 10px;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
  }
  .gio { font-size: 13px; color: rgba(255, 255, 255, 0.75); margin-top: 8px; }
  .footer { margin-top: 40px; color: rgba(255, 255, 255, 0.6); font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <img src="logo.png" alt="Đại học Cần Thơ" class="logo" onerror="this.style.display='none'">
  <h1>Quét QR Nhà Xe</h1>
  <p class="sub">Đưa mã QR trên thẻ SV vào camera</p>
</div>

<div class="controls">
  <button id="btnStart" onclick="batDau()">▶️ Bắt đầu</button>
  <button id="btnStop" onclick="dung()">⏹️ Dừng</button>
</div>

<div id="reader"></div>
<div id="result"></div>

<div class="footer">Hệ thống quản lý nhà xe - Đại học Cần Thơ</div>

<script>
// ================================================================
// ĐÃ CẬP NHẬT URL MỚI NHẤT CỦA BẠN
// ================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyoe-9FJpUovAaIlzsLWtXoHtTzDtIdRMJvoOtYy2eKO7L-CZPqXNHHW-YFQz1-57RrxA/exec";

let qr, dangQuet = false, khoa = false;
let trangThai = {};
let sttChoA = 0; 
let sttChoB = 0;

const amThanh = new Audio('beep.mp3');
amThanh.volume = 0.6;

// Thẻ Audio dùng cho giọng đọc Google
const audioGoogle = new Audio();

function phatAmThanh() {
  try {
    amThanh.currentTime = 0;
    amThanh.play().catch(e => console.log('Lỗi beep:', e));
  } catch (e) {}
}

// HÀM ĐỌC GIỌNG NÓI QUA GOOGLE DỊCH (Không lỗi font, chuẩn giọng nữ)
function docGiongNoi(text) {
  const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q=" + encodeURIComponent(text);
  audioGoogle.src = url;
  audioGoogle.play().catch(e => {
    console.log("Lỗi phát âm thanh Google:", e);
  });
}

function batDau() {
  // MỒI ÂM THANH ĐỂ LÁCH LUẬT CHẶN AUTOPLAY CỦA CHROME
  audioGoogle.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
  audioGoogle.play().catch(() => {});

  amThanh.play().then(() => { amThanh.pause(); amThanh.currentTime = 0; }).catch(() => {});

  if (dangQuet) return;
  
  // KHỞI ĐỘNG CAMERA
  qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onQuet,
    () => {}
  ).then(() => { 
    dangQuet = true;
    document.getElementById('reader').style.minHeight = 'auto';
  }).catch(e => alert("Không mở được camera: " + e));
}

function dung() {
  if (qr && dangQuet) {
    qr.stop().then(() => { 
      dangQuet = false; 
      qr.clear();
      document.getElementById('reader').style.minHeight = '380px';
    });
  }
}

function onQuet(text) {
  if (khoa) return;
  khoa = true;

  phatAmThanh();

  const maSV = text.trim();
  let hanhDong = 'VÀO';
  if (trangThai[maSV] === 'VÀO') hanhDong = 'RA';
  trangThai[maSV] = hanhDong;

  const gio = new Date().toLocaleTimeString('vi-VN');
  let viTriHienTai = "";
  let loHienTai = "A";

  if (hanhDong === 'VÀO') {
    if (sttChoA < 50) {
      sttChoA++;
      viTriHienTai = `A-${String(sttChoA).padStart(2, '0')}`;
      docGiongNoi(`Mời bạn vào lô A, vị trí A ${sttChoA}`);
    } else if (sttChoB < 45) {
      sttChoB++;
      loHienTai = "B";
      viTriHienTai = `B-${String(sttChoB).padStart(2, '0')}`;
      docGiongNoi(`Mời bạn vào lô B, vị trí B ${sttChoB}`);
    } else {
      viTriHienTai = "Bãi đã hết chỗ";
      docGiongNoi(`Xin lỗi, bãi xe đã hết chỗ`);
    }
  } else {
    viTriHienTai = "Đã ra khỏi bãi";
    docGiongNoi(`Tạm biệt bạn`);
  }

  hienThiKetQua(maSV, hanhDong, gio, loHienTai, viTriHienTai);
  
  // Gửi kèm Lô và Vị trí lên Google Sheets
  guiLenSheets(maSV, hanhDong, loHienTai, viTriHienTai);

  setTimeout(() => { khoa = false; }, 3000); 
}

function hienThiKetQua(maSV, hanhDong, gio, loHienTai, viTri) {
  const el = document.getElementById('result');
  el.className = hanhDong === 'VÀO' ? '' : 'ra';
  el.style.display = 'block';
  
  let html = `
    <div class="hanhDong">${hanhDong === 'VÀO' ? '🟢 VÀO' : '🟠 RA'}</div>
    <div class="maSV">MSSV: ${maSV}</div>
  `;
  
  if (hanhDong === 'VÀO') {
    html += `<div class="viTri">📍 Lô ${loHienTai} - Chỗ ${viTri}</div>`;
  } else {
    html += `<div class="viTri" style="color: white; background: transparent;">👋 ${viTri}</div>`;
  }

  html += `<div class="gio">🕐 ${gio}</div>`;
  el.innerHTML = html;
}

function guiLenSheets(maSV, hanhDong, maLo, viTri) {
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ 
      maSV: maSV, 
      hanhDong: hanhDong,
      maLo: maLo,       // Gửi mã lô
      viTri: viTri      // Gửi vị trí chỗ
    })
  }).catch(e => console.log('Gửi lỗi:', e));
}
</script>
</body>
</html>

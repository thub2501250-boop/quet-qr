<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét QR Nhà Xe</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #03045e 0%, #0077b6 100%);
    color: #caf0f8;
    min-height: 100vh;
    padding: 20px;
  }
  
  h1 {
    color: #00b4d8;
    text-align: center;
    margin-bottom: 10px;
    font-size: 28px;
    text-shadow: 0 2px 10px rgba(0, 180, 216, 0.5);
  }
  
  .sub {
    text-align: center;
    color: #90e0ef;
    margin-bottom: 20px;
    font-size: 14px;
  }
  
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  
  button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0, 180, 216, 0.5);
  }
  
  #btnStart {
    background: #00b4d8;
    color: #03045e;
  }
  
  #btnStop {
    background: #ef4444;
    color: #fff;
  }
  
  #reader {
    max-width: 500px;
    margin: 0 auto;
    border: 3px solid #00b4d8;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0, 180, 216, 0.4);
  }
  
  #result {
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    display: none;
  }
  
  #result.vao {
    background: #065f46;
    border: 3px solid #10b981;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
  }
  
  #result.ra {
    background: #7c2d12;
    border: 3px solid #f59e0b;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
  }
  
  #result.err {
    background: #7f1d1d;
    border: 3px solid #ef4444;
  }
  
  .hanhDong {
    font-size: 40px;
    font-weight: bold;
    color: #fff;
  }
  
  .hoTen {
    font-size: 26px;
    font-weight: bold;
    color: #caf0f8;
    margin: 8px 0;
  }
  
  .maSV {
    font-size: 20px;
    color: #90e0ef;
    margin-top: 8px;
  }
  
  .gio {
    font-size: 14px;
    color: #90e0ef;
    margin-top: 8px;
  }
</style>
</head>
<body>

<h1>🅿️ Quét QR Nhà Xe</h1>
<p class="sub">Đưa mã QR trên thẻ SV vào camera</p>

<div class="controls">
  <button id="btnStart" onclick="batDau()">▶️ Bắt đầu</button>
  <button id="btnStop" onclick="dung()">⏹️ Dừng</button>
</div>

<div id="reader"></div>
<div id="result"></div>

<script>
// ================================================================
// URL API - giữ nguyên URL cũ của bạn
// ================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbx1710tzj8UUJKETDPs8zkt39W3nz1TepvrOTFxgeOX9LegFwmeXRwqwbQC1VkgEwAcg/exec";
// ================================================================

let qr, dangQuet = false, khoa = false;
let trangThai = {};

function batDau() {
  if (dangQuet) return;
  qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onQuet,
    () => {}
  ).then(() => { dangQuet = true; })
   .catch(e => alert("Không mở được camera: " + e));
}

function dung() {
  if (qr && dangQuet) {
    qr.stop().then(() => { dangQuet = false; qr.clear(); });
  }
}

function onQuet(text) {
  if (khoa) return;
  khoa = true;

  const maSV = text.trim();
  let hanhDong = 'VÀO';
  if (trangThai[maSV] === 'VÀO') hanhDong = 'RA';
  trangThai[maSV] = hanhDong;

  const gio = new Date().toLocaleTimeString('vi-VN');

  hienThiKetQua(maSV, hanhDong, gio);
  guiLenSheets(maSV, hanhDong);

  setTimeout(() => { khoa = false; }, 2000);
}

function hienThiKetQua(maSV, hanhDong, gio) {
  const el = document.getElementById('result');
  el.className = hanhDong === 'VÀO' ? 'vao' : 'ra';
  el.style.display = 'block';
  el.innerHTML = `
    <div class="hanhDong">${hanhDong === 'VÀO' ? '🟢 VÀO' : '🟠 RA'}</div>
    <div class="maSV">MSSV: ${maSV}</div>
    <div class="gio">🕐 ${gio}</div>
  `;
}

function guiLenSheets(maSV, hanhDong) {
  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ maSV: maSV, hanhDong: hanhDong })
  }).catch(e => console.log('Gửi lỗi:', e));
}
</script>
</body>
</html>
